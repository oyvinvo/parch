<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' asset: http://asset.localhost data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none';" />
    <title>Parch</title>
    <link rel="icon" type="image/svg+xml" href="/packaging/icons/parch.svg" />
  </head>
  <body>
    <a href="#document-viewer" class="parchment-skip-link">Skip to document content</a>

    <div id="app" class="parchment-app">
      <header class="parchment-toolbar" role="banner">
        <div class="toolbar-section toolbar-left">
          <div class="parchment-brand">
            <svg class="brand-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="currentColor">
              <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14H6v-2h6v2zm4-4H6v-2h10v2zm0-4H6V7h10v2z"/>
            </svg>
            <span class="brand-title">Parch</span>
          </div>
          <div class="parchment-nav-group">
            <button id="btn-nav-back" type="button" class="parchment-tool-btn parchment-nav-btn" disabled aria-label="Navigate back (Alt+Left)" title="Navigate back (Alt+Left)">←</button>
            <button id="btn-nav-forward" type="button" class="parchment-tool-btn parchment-nav-btn" disabled aria-label="Navigate forward (Alt+Right)" title="Navigate forward (Alt+Right)">→</button>
          </div>
          <span id="active-filename" class="parchment-filename">No document open</span>
          <span id="reload-status-badge" class="parchment-badge" title="Live Auto-Reload active">Live</span>
          <button id="btn-update-badge" type="button" class="parchment-update-badge" hidden title="Click to install update">⬆ Update available</button>
        </div>

        <div class="toolbar-section toolbar-right">
          <button id="btn-open-file" type="button" class="parchment-tool-btn" aria-label="Open document file (Ctrl+O)" title="Open document file (Ctrl+O)">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="currentColor">
              <path d="M1.75 2.5a.25.25 0 0 0-.25.25v10.5c0 .138.112.25.25.25h12.5a.25.25 0 0 0 .25-.25v-8.5a.25.25 0 0 0-.25-.25H7.707l-1.853-1.854A.75.75 0 0 0 5.323 2.5H1.75Z"/>
            </svg>
            <span>Open</span>
          </button>
          <input id="file-input" type="file" accept=".md,.markdown,.mdown,.mkd,.txt" style="display: none;" />

          <button id="btn-toggle-toc" type="button" class="parchment-tool-btn" aria-label="Toggle Table of Contents (Ctrl+\)" aria-expanded="true" title="Toggle Table of Contents (Ctrl+\)">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="currentColor">
              <path d="M2 3.75A.75.75 0 0 1 2.75 3h10.5a.75.75 0 0 1 0 1.5H2.75A.75.75 0 0 1 2 3.75Zm0 4.25a.75.75 0 0 1 .75-.75h10.5a.75.75 0 0 1 0 1.5H2.75A.75.75 0 0 1 2 8Zm0 4.25a.75.75 0 0 1 .75-.75h7.5a.75.75 0 0 1 0 1.5h-7.5a.75.75 0 0 1-.75-.75Z"/>
            </svg>
            <span>TOC</span>
          </button>

          <button id="btn-toggle-search" type="button" class="parchment-tool-btn" aria-label="Find in document (Ctrl+F)" aria-expanded="false" title="Find in document (Ctrl+F)">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="currentColor">
              <path d="M10.68 11.74a6 6 0 0 1-7.922-8.982 6 6 0 0 1 8.982 7.922l3.04 3.04a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215ZM11.5 7a4.499 4.499 0 1 0-8.997 0A4.499 4.499 0 0 0 11.5 7Z"/>
            </svg>
            <span>Search</span>
          </button>

          <button id="btn-theme-selector" type="button" class="parchment-tool-btn" aria-label="Switch theme mode (F10)" title="Switch theme mode (F10)">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="currentColor">
              <path d="M8 12a4 4 0 1 1 0-8 4 4 0 0 1 0 8Zm0-1.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Zm0-10a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0v-1.5A.75.75 0 0 1 8 .5Zm0 13a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0v-1.5A.75.75 0 0 1 8 13.5Zm7.5-6a.75.75 0 0 1-.75.75h-1.5a.75.75 0 0 1 0-1.5h1.5a.75.75 0 0 1 .75.75Zm-13 0a.75.75 0 0 1-.75.75H.75a.75.75 0 0 1 0-1.5h1.5a.75.75 0 0 1 .75.75Z"/>
            </svg>
            <span id="theme-label">Theme: System</span>
          </button>
        </div>
      </header>

      <aside id="search-bar" class="parchment-search-bar" role="search" aria-label="In-Document Search" hidden>
        <div class="search-bar-inner">
          <input id="search-input" type="search" placeholder="Find in document..." aria-label="Find in document" />
          <span id="search-counter" class="parchment-search-counter" aria-live="polite">0 matches</span>
          <button id="btn-search-prev" type="button" class="parchment-search-btn" aria-label="Previous match (Shift+Enter)" title="Previous match (Shift+Enter)">▲</button>
          <button id="btn-search-next" type="button" class="parchment-search-btn" aria-label="Next match (Enter)" title="Next match (Enter)">▼</button>
          <button id="btn-search-close" type="button" class="parchment-search-btn" aria-label="Close search (Esc)" title="Close search (Esc)">✕</button>
        </div>
      </aside>

      <div class="parchment-workspace">
        <nav id="toc-sidebar" class="parchment-sidebar" aria-label="Table of Contents">
          <h2 class="parchment-sidebar-heading">Table of Contents</h2>
          <div id="toc-container" class="parchment-toc-container"></div>
        </nav>

        <main id="document-viewer" class="parchment-main-viewer" tabindex="-1">
          <div id="warning-banner" class="parchment-warning-banner" role="alert" hidden></div>
          <article id="document-content" class="parchment-markdown-body" role="main">
            <section class="parchment-empty-state">
              <h2>Welcome to Parch</h2>
              <p class="empty-lead">Distraction-free, literary Markdown reader for Linux desktop.</p>
              <div class="empty-actions">
                <button id="btn-empty-open" type="button" class="parchment-btn-primary">Open Markdown File (Ctrl+O)</button>
                <button id="btn-load-sample" type="button" class="parchment-btn-secondary">Load Showcase File</button>
              </div>
              <p class="empty-hint">Keyboard shortcuts: <kbd>Ctrl+O</kbd> Open | <kbd>Ctrl+\</kbd> Toggle TOC | <kbd>Ctrl+F</kbd> Search | <kbd>F10</kbd> Theme</p>
            </section>
          </article>
        </main>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
