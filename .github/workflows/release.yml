name: Release Automation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag to build (e.g. v0.2.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-linux-assets:
    name: Build & Publish Linux Release Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Packaging Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rpm alien

      - name: Determine Release Version & Tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV
          echo "RELEASE_VERSION=${TAG#v}" >> $GITHUB_ENV
          echo "Building Linux assets for release tag: ${TAG}"

      - name: Build & Package Linux Release Artifacts (.deb, .tar.gz, .rpm, SHA256SUMS)
        run: |
          chmod +x scripts/package-release.sh
          ./scripts/package-release.sh "$RELEASE_VERSION"

      - name: Publish Linux Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            release-dist/*.deb
            release-dist/*.tar.gz
            release-dist/*.rpm
            release-dist/SHA256SUMS
          token: ${{ secrets.GITHUB_TOKEN }}

  build-macos-assets:
    name: Build & Publish macOS Release Assets
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Determine Release Version & Tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV
          echo "RELEASE_VERSION=${TAG#v}" >> $GITHUB_ENV
          echo "Building macOS assets for release tag: ${TAG}"

      - name: Build & Package macOS Artifacts (Parch.app zip, tar.gz)
        run: |
          chmod +x scripts/package-macos.sh
          ./scripts/package-macos.sh "$RELEASE_VERSION"

      - name: Publish macOS Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            release-dist/Parch-*-macos-*.zip
            release-dist/parch-*-macos-*.tar.gz
            release-dist/SHA256SUMS-macos.txt
          token: ${{ secrets.GITHUB_TOKEN }}
